<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7-Shop Online | สั่งสินค้าออนไลน์</title>
  </head>
  <body class="bg-gray-100 min-h-screen font-sans pb-16">
    
    <!-- แถบเมนูด้านบน (Navbar สไตล์ 7-Eleven) -->
    <header class="bg-[#008060] text-white sticky top-0 z-40 shadow-md">
      <!-- แถบสีส้ม-แดง ด้านบนสุด -->
      <div class="h-1.5 bg-gradient-to-right from-[#F58220] via-[#EE2E24] to-[#008060]"></div>
      
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
        <!-- โลโก้ร้าน -->
        <div class="flex items-center gap-2 shrink-0">
          <div class="bg-white text-[#008060] font-black text-xl px-2.5 py-1 rounded-lg tracking-tighter">
            7-<span class="text-[#F58220]">SHOP</span>
          </div>
          <span class="hidden sm:inline text-sm font-medium text-green-100">สั่งง่าย ส่งไว</span>
        </div>

        <!-- ช่องค้นหา -->
        <div class="flex-1 max-w-xl relative">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="ค้นหาสินค้า ขนม เครื่องดื่ม ของใช้..." 
            class="w-full rounded-full py-2 pl-4 pr-10 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-[#F58220]"
          />
          <span class="absolute right-3.5 top-2 text-gray-400">🔍</span>
        </div>

        <!-- ปุ่มเปิดตะกร้าสินค้า -->
        <button 
          id="openCartBtn" 
          class="relative bg-[#F58220] hover:bg-[#e07316] text-white px-4 py-2 rounded-full font-semibold text-sm flex items-center gap-2 transition shrink-0 shadow"
        >
          <span>🛒 ตะกร้า</span>
          <span id="cartBadge" class="bg-[#EE2E24] text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </header>

    <!-- แถบเลือกหมวดหมู่สินค้า -->
    <div class="bg-white shadow-sm border-b sticky top-\[62px]\ z-30">
      <div class="max-w-6xl mx-auto px-4 py-2.5 flex gap-2 overflow-x-auto" id="categoryContainer">
        <button data-cat="all" class="cat-btn active bg-[#008060] text-white px-4 py-1.5 rounded-full text-sm font-medium shrink-0">ทั้งหมด</button>
        <button data-cat="food" class="cat-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium shrink-0">🍱 อาหารพร้อมทาน</button>
        <button data-cat="drink" class="cat-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium shrink-0">🥤 เครื่องดื่ม</button>
        <button data-cat="snack" class="cat-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium shrink-0">🍿 ขนมขบเคี้ยว</button>
        <button data-cat="daily" class="cat-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium shrink-0">🧴 ของใช้ส่วนตัว</button>
      </div>
    </div>

    <!-- พื้นที่แสดงรายการสินค้า -->
    <main class="max-w-6xl mx-auto px-4 mt-6">
      <!-- แบนเนอร์โปรโมชั่น -->
      <div class="bg-gradient-to-right from-[#008060] to-[#00a87e] rounded-2xl p-5 mb-6 text-white flex items-center justify-between shadow-sm">
        <div>
          <span class="bg-[#EE2E24] text-xs font-bold px-2.5 py-1 rounded uppercase">โปรโมชั่นพิเศษ</span>
          <h2 class="text-xl sm:text-2xl font-bold mt-2">จัดส่งฟรี! เมื่อสั่งซื้อครบ 100 บาทขึ้นไป</h2>
          <p class="text-sm text-green-100 mt-1">เช็คสต็อกเรียลไทม์ พร้อมส่งตรงถึงหน้าบ้านคุณ</p>
        </div>
        <div class="text-5xl hidden sm:block">🛵💨</div>
      </div>

      <!-- Grid แสดงการ์ดสินค้า -->
      <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <!-- การ์ดสินค้าจะถูกสร้างจาก main.js -->
      </div>
    </main>

    <!-- หน้าต่างตะกร้าสินค้า (Slide-over Drawer) -->
    <div id="cartDrawer" class="fixed inset-0 bg-black/50 z-50 hidden justify-end">
      <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
        <div class="p-4 bg-[#008060] text-white flex justify-between items-center">
          <h3 class="font-bold text-lg">🛒 ตะกร้าสินค้าของคุณ</h3>
          <button id="closeCartBtn" class="text-white hover:text-gray-200 text-2xl leading-none">&times;</button>
        </div>
        
        <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
          <!-- รายการในตะกร้า -->
        </div>

        <div class="p-4 border-t bg-gray-50">
          <div class="flex justify-between text-base font-bold text-gray-800 mb-3">
            <span>ยอดรวมทั้งหมด:</span>
            <span id="cartTotal" class="text-[#EE2E24] text-xl">฿0</span>
          </div>
          <button id="checkoutBtn" class="w-full bg-[#F58220] hover:bg-[#e07316] text-white font-bold py-3 rounded-xl shadow transition">
            ยืนยันการสั่งซื้อ
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
